<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Kulüp Başvurusu | İstanbul Kulüpler</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#162747;background:#f1f5fa}*{box-sizing:border-box}body{margin:0}header{background:#10254c;color:white;padding:22px 16px}header div,main{max-width:980px;margin:auto}h1{font-size:23px;margin:0}header a{color:white}main{padding:16px}.card{background:white;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #20385410}h2{font-size:20px;margin:0 0 12px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,select{width:100%;font:inherit;padding:12px;border:1px solid #ccd6e4;border-radius:9px}button{cursor:pointer;border:0;border-radius:9px;background:#142d58;color:white;padding:12px 15px;font-size:15px;font-weight:bold;margin:5px 5px 5px 0}.secondary{background:#e5ecf6;color:#142d58}.danger{background:#b91c35}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.hidden{display:none!important}.hint{color:#5d6b80;font-size:13px}.msg{white-space:pre-wrap;border-radius:8px;padding:12px;background:#e8f0fa}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:630px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e4e8ef;font-size:14px}th{background:#f0f3f9}.pill{border-radius:20px;padding:3px 9px;background:#edf1f5;font-size:12px;display:inline-block}
</style><script>if(location.hash==="#yonetici"){location.replace("admin.html#basvurular")}</script></head><body>
<header><div><h1>🥋 Online Kulüp ve Sporcu Başvurusu</h1><p>İstanbul Kulüpler Turnuva Sistemi</p></div></header>
<main>
<div class="card"><strong>Durum:</strong> <span id="state">Bağlantı kontrol ediliyor…</span><p id="message" class="hint"></p></div>
<section id="guest" class="card">
<h2>Şifresiz sporcu başvurusu</h2>
<p class="hint">Kulüp yetkilileri üye olmadan doğrudan form doldurabilir. Başvurular yönetici onayına gönderilir. Kulüp bilgileri henüz doğrulanmamış sayılır.</p>
<form id="guestForm">
<div class="grid">
<div><label for="guestClub">Kulüp adı</label><input id="guestClub" required maxlength="150"></div>
<div><label for="guestCoach">Antrenör adı soyadı</label><input id="guestCoach" required maxlength="150"></div>
<div><label for="guestPhone">İletişim telefonu</label><input id="guestPhone" type="tel" required maxlength="30"></div>
<div><label for="guestName">Sporcu adı soyadı</label><input id="guestName" required maxlength="150"></div>
<div><label for="guestBirthDay">Doğum tarihi</label><div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr);gap:6px"><div><label for="guestBirthDay">Gün</label><input id="guestBirthDay" type="text" inputmode="numeric" maxlength="2" pattern="[0-9]{1,2}" placeholder="GG" required></div><div><label for="guestBirthMonth">Ay</label><input id="guestBirthMonth" type="text" inputmode="numeric" maxlength="2" pattern="[0-9]{1,2}" placeholder="AA" required></div><div><label for="guestBirthYear">Yıl</label><input id="guestBirthYear" type="text" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="YYYY" required></div></div></div>
<div><label for="guestGender">Cinsiyet</label><select id="guestGender"><option>Erkek</option><option>Bayan</option></select></div>
<div><label for="guestAge">Yaş grubu</label><select id="guestAge"><option>Alt Minik</option><option>Minik</option><option>Yıldız</option><option>Genç</option><option>Ümit</option><option>Büyük</option></select></div>
<div><label for="guestWeight">Kilo kategorisi</label><select id="guestWeight" required></select><input id="guestWeightOther" class="hidden" maxlength="10" placeholder="Kilo kategorisini yazın (ör. +63)" aria-label="Diğer kilo kategorisi"></div>
<div><label for="guestLicense">Lisans numarası (isteğe bağlı)</label><input id="guestLicense" maxlength="100"></div>
</div>
<div class="hidden" aria-hidden="true"><label for="guestWebsite">Web sitesi</label><input id="guestWebsite" tabindex="-1" autocomplete="off"></div>
<button type="submit" id="guestSubmit">Başvuruyu yöneticiye gönder</button><p id="guestResult" role="status" aria-live="polite" style="display:none;padding:15px;border-radius:10px;font-weight:700;margin:12px 0"></p>
</form>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const SUPABASE_URL='https://wdwyirlqgptbprfzleli.supabase.co';
const SUPABASE_KEY='sb_publishable_pDULKkJ7MWEg-GijQGnLHQ_mcP12FAy';
const $=id=>document.getElementById(id),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ages=['Alt Minik','Minik','Yıldız','Genç','Ümit','Büyük'];const base={
 'Alt Minik|Erkek':['25','27','30','33','35','38','41','45','48','51','55','57','+57'],
 'Alt Minik|Bayan':['25','27','30','33','35','38','41','45','48','51','55','57','+57'],
'Minik|Erkek':['30','33','36','40','45','50','57','+57'],'Minik|Bayan':['27','30','33','36','40','45','50','57','+57'],
'Yıldız|Erkek':['33','37','41','45','49','53','57','61','65','+65'],
'Yıldız|Bayan':['29','33','37','41','44','47','51','55','59','+59'],
'Genç|Erkek':['45','48','51','55','59','63','68','73','78','+78'],
'Genç|Bayan':['42','44','46','49','52','55','59','63','68','+68'],
'Ümit|Bayan':['46','49','53','57','62','67','73','+73'],'Büyük|Bayan':['46','49','53','57','62','67','73','+73'],
'Ümit|Erkek':['54','58','63','68','74','80','87','+87'],'Büyük|Erkek':['54','58','63','68','74','80','87','+87']};
function setWeightOptions(ageId,genderId,weightId,otherId){
 const select=$(weightId),input=$(otherId);
 if(!select||!input)return;
 const vals=base[$(ageId).value+'|'+$(genderId).value]||[];
 const before=select.value;
 select.innerHTML='<option value="">Kilo seçiniz</option>'+vals.map(v=>'<option value="'+v+'">'+v+' kg</option>').join('')+'<option value="other">Diğer / listede yok</option>';
 if(vals.includes(before))select.value=before;
 else select.value='';
 input.classList.add('hidden');input.required=false;
 select.onchange=()=>{
  const other=select.value==='other';
  input.classList.toggle('hidden',!other);
  input.required=other;
  if(!other)input.value='';
 };
}
function readBirthDate(prefix){
 const day=document.getElementById(prefix+'Day').value.trim(),month=document.getElementById(prefix+'Month').value.trim(),year=document.getElementById(prefix+'Year').value.trim();
 if(!/^\d{1,2}$/.test(day)||!/^\d{1,2}$/.test(month)||!/^\d{4}$/.test(year))return '';
 const d=Number(day),m=Number(month),y=Number(year);
 if(y<1900||m<1||m>12||d<1||d>31)return '';
 const date=new Date(y,m-1,d);
 if(date.getFullYear()!==y||date.getMonth()!==m-1||date.getDate()!==d||date>new Date())return '';
 return year+'-'+month.padStart(2,'0')+'-'+day.padStart(2,'0');
}
function setBirthDate(prefix,value=''){
 const [y,m,d]=String(value).split('-');
 document.getElementById(prefix+'Day').value=d||'';
 document.getElementById(prefix+'Month').value=m||'';
 document.getElementById(prefix+'Year').value=y||'';
}
function initializeWeightPickers(){
 for(const [age,gender,weight,other] of [['guestAge','guestGender','guestWeight','guestWeightOther']]){
  const update=()=>setWeightOptions(age,gender,weight,other);
  $(age).addEventListener('change',update);
  $(gender).addEventListener('change',update);
  update();
 }
}
function selectedWeight(selectId,otherId){
 const value=$(selectId).value;
 return value==='other'?$(otherId).value.trim():value;
}

let api;
function notify(t){$('message').textContent=t||''}
function guestNotice(t,ok){const el=$('guestResult');el.style.display='block';el.style.background=ok?'#dcfce7':'#fee2e2';el.style.color=ok?'#14532d':'#991b1b';el.textContent=t;el.scrollIntoView({behavior:'smooth',block:'center'});notify(t)}
function state(t){$('state').textContent=t}
function show(id,yes){$(id).classList.toggle('hidden',!yes)}
function error(err){console.error(err);notify('İşlem başarısız: '+(err?.message||String(err)))}
function btn(text,action){return '<button data-action="'+action+'">'+text+'</button>'}
async function boot(){
 if(!window.supabase){state('Bağlantı kütüphanesi yüklenemedi');notify('İnternet bağlantınızı kontrol edin.');return}
 api=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'istanbulGuestPublic',autoRefreshToken:false,persistSession:false,detectSessionInUrl:false}});
 state('Şifresiz başvuru formu hazır');
}
$('guestForm').onsubmit=async ev=>{
 ev.preventDefault();
 const form=ev.currentTarget,button=$('guestSubmit');$('guestResult').style.display='none';
 if(button.disabled)return;
 if(!api){guestNotice('Veritabanına bağlantı kurulamadı. Sayfayı yenileyip tekrar deneyin.',false);return}
 if($('guestWebsite').value.trim()){guestNotice('Başvuru doğrulanamadı. Tekrar deneyin.',false);return}
 if(!form.reportValidity())return;
 const weight=selectedWeight('guestWeight','guestWeightOther');
 if(!/^\+?\d{1,3}(?:[.,]\d{1,2})?$/.test(weight)){guestNotice('Lütfen kilo kategorisi seçin.',false);return}
 const birth=readBirthDate('guestBirth');if(!birth){guestNotice('Geçerli bir doğum tarihi girin (gün, ay, yıl).',false);return}
 const payload={club_name:$('guestClub').value.trim(),coach_name:$('guestCoach').value.trim(),contact_phone:$('guestPhone').value.trim(),athlete_name:$('guestName').value.trim(),birth_date:birth,gender:$('guestGender').value,age_group:$('guestAge').value,weight:weight.replace(',','.'),license:$('guestLicense').value.trim()};
 if(!payload.club_name||!payload.coach_name||!payload.contact_phone||!payload.athlete_name){guestNotice('Lütfen zorunlu alanları doldurun.',false);return}
 if(payload.birth_date>new Date().toISOString().slice(0,10)){guestNotice('Doğum tarihi gelecekte olamaz.',false);return}
 button.disabled=true;button.textContent='Başvuru gönderiliyor…';
 try{
  const {error:err}=await api.from('guest_athlete_applications').insert(payload);
  if(err)throw err;
  $('guestName').value='';setBirthDate('guestBirth');$('guestLicense').value='';$('guestWeight').value='';$('guestWeightOther').value='';setWeightOptions('guestAge','guestGender','guestWeight','guestWeightOther');
  guestNotice('✓ BAŞVURU GÖNDERİLDİ. Sporcu yönetici onayı bekliyor. Kulüp bilgileri korundu; sıradaki sporcuyu ekleyebilirsiniz.',true);
 }catch(err){
  console.error('Misafir başvurusu başarısız',err);
  guestNotice('BAŞVURU KAYDEDİLEMEDİ: '+(err?.message||'Bağlantı hatası. İnterneti kontrol edin ve tekrar deneyin.'),false);
 }finally{button.disabled=false;button.textContent='Başvuruyu yöneticiye gönder'}
};
initializeWeightPickers();
boot().catch(error);
</script></body></html>
